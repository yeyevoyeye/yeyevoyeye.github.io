<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Resume | YEYE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ================= 基础样式 (保持统一) ================= */
        body {
            font-family: "Inter", Helvetica, Arial, sans-serif;
            margin: 0; padding: 20px; color: #333; line-height: 1.4;
            background: #fff; min-height: 100vh;
            display: flex; flex-direction: column;
            box-sizing: border-box;
        }

        /* 背景效果 */
        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background-image: url("assets/bg.jpg"); /* 确保背景图路径正确 */
            background-size: cover; background-position: left center;
            filter: grayscale(100%); opacity: 0.18; pointer-events: none;
        }
        body::after {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background: rgba(255,255,255,0.75); pointer-events: none;
        }

        /* ================= 头部导航 ================= */
        header { display: flex; justify-content: space-between; margin-bottom: 40px; align-items: flex-start;  font-size: 13px; 
                 padding: 12px; box-sizing: border-box;}
        .logo { font-family: "Inter", Helvetica, Arial, sans-serif;
                font-weight: 700;; font-size: 22px; line-height: 0.95; letter-spacing: 0px; text-transform: uppercase; 
                  text-decoration: none; color: #333; display: block;} 
        nav ul { list-style: none; padding: 0; margin: 0; display: flex; /* 横排 */ gap: 22px; /* 菜单间距 */
                 align-items: center; }
        nav a { text-decoration: none; color: #000; text-transform: uppercase; display: inline-block; font-size: 13px; padding: 2px 6px; }
        nav a.active{ background: #ccc; color: #fff;}

        /* ================= Resume 布局区域 ================= */
        .resume-container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            gap: 60px;
            flex-wrap: wrap; /* 响应式换行 */
        }

        /* 左侧：文字信息 */
        .info-col {
            flex: 1;
            min-width: 250px;
            padding-top: 10px;
        }

        .info-col h1 {
            font-size: 32px; font-weight: 700; margin: 0 0 20px 0;
            text-transform: uppercase; letter-spacing: -0.5px;
        }

        .info-col p { font-size: 14px; margin-bottom: 20px; color: #555; }
        .info-col a { color: #000; text-decoration: underline; }
        .info-col a:hover { color: #666; }

        /* 下载按钮样式 */
        .download-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            border-radius: 4px;
            transition: 0.2s;
        }
        .download-btn:hover { background: #444; }

        /* 右侧：简历预览 */
        .resume-preview-col {
            flex: 1.5;
            min-width: 300px;
        }

        .resume-paper {
            background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid #eee;
            width: 100%;
            /* 模拟A4纸比例 */
            aspect-ratio: 1 / 1.414; 
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .resume-paper:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .resume-paper img {
            width: 100%; height: 100%; object-fit: cover; display: block;
        }

        footer {
            margin-top: auto; /* 推到底部 */
            padding-top: 50px;
            font-size: 10px; color: #ccc; text-align: center;
        }

        @media (max-width: 768px) {
            .resume-container { flex-direction: column; gap: 40px; }
            header { margin-bottom: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">YEYE<br>PORTFOLIO</a>
        <nav>
            <ul>
                <li><a href="index.html">PROJECTS</a></li>
                <li><a href="contact.html" class="active">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main class="resume-container">
        <div class="info-col">
            <h1>Let's Connect</h1>
            <p>
                Currently based in Pittsburgh, PA.<br>
                Graduate student at CMU, focusing on Architectural Intelligence.
            </p>
            
            <p><strong>Email:</strong><br> <a href="mailto:yeye@example.com">yeye@example.com</a></p>
            <p><strong>Social:</strong><br> 
                <a href="#" target="_blank">LinkedIn</a> / 
                <a href="#" target="_blank">Instagram</a>
            </p>

            <a href="assets/Yeye_Resume.pdf" class="download-btn" target="_blank">Download Resume (PDF)</a>
        </div>

        <div class="resume-preview-col">
            <div class="resume-paper">
                <img src="assets/resume_preview.jpg" alt="Resume Preview">
            </div>
        </div>
    </main>

    <footer>© 2025 yeyevoyeye</footer>

</body>
</html>
